global:
  scrape_interval: 15s # How frequently to scrape targets
  evaluation_interval: 15s # How frequently to evaluate rules

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Prometheus itself

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000'] # Scrape Grafana's metrics endpoint

  # Example: Scrape a node exporter if you have one running
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['node_exporter:9100'] # Replace with your node exporter host/port

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100'] # Scrape Loki's metrics endpoint