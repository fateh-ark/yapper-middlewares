http {
    upstream user_service {
        server your_user_service_host:your_user_service_port;
    }

    server {
        listen 80;
        server_name your_domain.com; # Replace with your actual domain or IP

        location /user/v1/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # You can add other locations for static files, other services, etc.
        location / {
            # Optional: Serve a default page or redirect
            return 200 'Welcome to the API Gateway!';
        }
    }
}