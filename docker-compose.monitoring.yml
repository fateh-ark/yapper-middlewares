name: yapper-monitoring

networks:
  yapper-monitoring-net:

volumes:
  yapper-grafana-data: {}
  yapper-prometheus-data: {}
  yapper-loki-data: {}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - yapper-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d' # Adjust retention as needed
    networks:
      - yapper-monitoring-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      # - ./monitoring/loki-local-config.yaml:/etc/loki/local-config.yaml
      - yapper-loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - yapper-monitoring-net

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3005:3000"
    networks:
      - yapper-monitoring-net
    volumes:
      - yapper-grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    depends_on:
      - loki
      - prometheus
